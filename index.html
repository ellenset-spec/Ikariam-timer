<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ikariam Operations Board</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.top-buttons{
    text-align:center;
    margin-bottom:20px;
}

button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-weight:bold;
}

.add{
    background:#2563eb;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:15px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
}

.name{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.time{
    text-align:center;
    font-size:42px;
    margin-bottom:15px;
    font-weight:bold;
}

.controls{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.controls input{
    width:90px;
    padding:8px;
    border:none;
    border-radius:8px;
}

.start{
    background:#16a34a;
    color:white;
}

.reset{
    background:#dc2626;
    color:white;
}

.rename{
    background:#f59e0b;
}

.warning{
    background:#78350f;
}

.danger{
    background:#991b1b;
}

.flash{
    animation:flash 1s infinite;
}

@keyframes flash{
    50%{
        opacity:0.5;
    }
}

.small{
    text-align:center;
    color:#cbd5e1;
}

</style>
</head>

<body>

<div class="container">

<h1>⚔️ Ikariam Operations Board</h1>

<div class="top-buttons">
<button class="add" onclick="addClock()">+ Add Clock</button>
</div>

<div class="grid" id="board"></div>

</div>

<script>

let clocks =
JSON.parse(localStorage.getItem("ikariamClocks")) || [
    {name:"ALPHA ➜ BETA"},
    {name:"ALPHA ➜ GAMMA"},
    {name:"FLEET RETURN"}
];

clocks.forEach(c=>{
    if(!c.endTime)
        c.endTime = null;
});

save();

function save(){
    localStorage.setItem(
        "ikariamClocks",
        JSON.stringify(clocks)
    );
}

function addClock(){

    const name = prompt(
        "Clock Name:"
    );

    if(!name) return;

    clocks.push({
        name:name,
        endTime:null
    });

    save();
    render();
}

function renameClock(index){

    const newName = prompt(
        "New Name:",
        clocks[index].name
    );

    if(!newName) return;

    clocks[index].name = newName;

    save();
    render();
}

function startClock(index){

    const minutes =
    Number(
        document.getElementById(
            "minutes-"+index
        ).value
    );

    if(!minutes || minutes <= 0)
        return;

    clocks[index].endTime =
        Date.now() +
        (minutes * 60000);

    save();
}

function resetClock(index){

    clocks[index].endTime = null;

    save();
    render();
}

function format(ms){

    if(ms <= 0)
        return "00:00:00";

    let total =
    Math.floor(ms/1000);

    let hours =
    Math.floor(total/3600);

    let minutes =
    Math.floor(
        (total%3600)/60
    );

    let seconds =
    total%60;

    return
        String(hours)
        .padStart(2,"0")
        + ":" +
        String(minutes)
        .padStart(2,"0")
        + ":" +
        String(seconds)
        .padStart(2,"0");
}

function render(){

    const board =
    document.getElementById("board");

    board.innerHTML = "";

    clocks.forEach((clock,index)=>{

        let remaining = 0;

        if(clock.endTime){
            remaining =
            clock.endTime -
            Date.now();
        }

        let classes = "card";

        if(
            remaining > 0 &&
            remaining < 300000
        ){
            classes += " warning";
        }

        if(
            remaining > 0 &&
            remaining < 60000
        ){
            classes +=
            " danger flash";
        }

        board.innerHTML += `
        <div class="${classes}">

            <div class="name">
                ${clock.name}
            </div>

            <div class="time">
                ${format(remaining)}
            </div>

            <div class="controls">
                <input
                    id="minutes-${index}"
                    type="number"
                    placeholder="Minutes">

                <button
                    class="start"
                    onclick="startClock(${index})">
                    Start
                </button>

                <button
                    class="reset"
                    onclick="resetClock(${index})">
                    Reset
                </button>
            </div>

            <div class="small">
                <button class="rename"
                onclick="renameClock(${index})">
                Edit Name
                </button>
            </div>

        </div>
        `;
    });
}

setInterval(render,1000);

render();

</script>

</body>
</html>
